<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Link in Bio - Xolo Tech</title>
    
    <!-- Font Awesome para iconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styless.css">
</head>
<body>

    <!-- Contenedor principal centrado -->
    <main class="main-container">
        
        <!-- LOGO: Imagen de perfil circular -->
        <div class="profile-logo" id="profile-logo">
            <!-- La imagen se insertará dinámicamente desde script.js -->
        </div>

        <!-- NOMBRE: Título principal -->
        <h1 class="profile-name" id="profile-name">
            <!-- El nombre se insertará dinámicamente -->
        </h1>

        <!-- DESCRIPCIÓN: Texto corto debajo del nombre -->
        <p class="profile-description" id="profile-description">
            <!-- La descripción se insertará dinámicamente -->
        </p>

        <!-- BOTONES: Contenedor para los enlaces de redes sociales -->
        <div class="social-links" id="social-links">
            <!-- Los botones se generarán dinámicamente desde script.js -->
        </div>

    </main>
    <!-- Elementos decorativos futuristas (solo visibles en computadora) -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="neon-ring"></div>
    <div class="neon-ring"></div>
    <div class="neon-ring"></div>
    <!-- JavaScript para la configuración y la lógica -->
    <script src="script.js"></script>
</body>
</html>
